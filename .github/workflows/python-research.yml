name: Reusable Python research smoke

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for syntax validation.
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: Research source directory.
        required: false
        type: string
        default: "."
      smoke-command:
        description: Dependency-free smoke command.
        required: false
        type: string
        default: python -m compileall -q -x '(^|/)(\.git|\.venv|venv|build|dist)(/|$)' .

permissions:
  contents: read

jobs:
  smoke:
    name: Python research smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run research smoke
        env:
          CLARK_CI_COMMAND: ${{ inputs.smoke-command }}
        run: bash -euo pipefail -c "$CLARK_CI_COMMAND"
