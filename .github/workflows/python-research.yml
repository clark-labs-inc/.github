name: Reusable Python research smoke

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for syntax validation.
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: Research source directory.
        required: false
        type: string
        default: "."
      smoke-command:
        description: Dependency-free smoke command.
        required: false
        type: string
        default: python -m compileall -q -x '(^|/)(\.git|\.venv|venv|build|dist)(/|$)' .

permissions:
  contents: read

jobs:
  smoke:
    name: Python research smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run research smoke
        env:
          CLARK_CI_COMMAND: ${{ inputs.smoke-command }}
        run: bash -euo pipefail -c "$CLARK_CI_COMMAND"
