name: Reusable Rust research smoke

on:
  workflow_call:
    inputs:
      rust-version:
        description: Rust toolchain version.
        required: false
        type: string
        default: "1.97.1"
      working-directory:
        description: Directory containing Cargo.toml.
        required: false
        type: string
        default: "."
      smoke-command:
        description: Dependency build and compiler smoke command.
        required: false
        type: string
        default: cargo check --all-targets

permissions:
  contents: read

jobs:
  smoke:
    name: Rust research smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ inputs.rust-version }}
      - name: Run research smoke
        env:
          CLARK_CI_COMMAND: ${{ inputs.smoke-command }}
        run: bash -euo pipefail -c "$CLARK_CI_COMMAND"
